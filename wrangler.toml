# Static Astro site — output lives in dist/ (do not add @astrojs/cloudflare).
name = "mw4-hacks-org"
compatibility_date = "2025-11-08"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Custom domain: Cloudflare Dashboard → Workers → mw4-hacks-org → Settings → Domains & Routes → Add `mw4-hacks.org`
# (Zone must exist in this account — wrangler cannot attach if the domain DNS is elsewhere.)
